<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección Sweed</title>
  <meta name="description" content="Catálogo de la colección: cromos, cartas, juguetes, videojuegos, libros y más.">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#6366f1">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#07080c">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/">
        <span class="brand__mark" aria-hidden="true">✦</span>
        Colección Sweed
      </a>

      <nav class="nav-links" aria-label="Secciones">
        <a href="/" aria-current="page">🖼️ Galería</a>
        <a href="stats">📊 Estadísticas</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="toolbar" id="toolbar">
      <div class="toolbar__row">
        <div class="search-field" id="searchField">
          <span class="search-field__icon" aria-hidden="true">🔍</span>
          <input id="search" type="search" placeholder="Buscar por nombre, marca, año…" autocomplete="off" aria-label="Buscar en la colección">
          <button class="search-field__clear" id="searchClear" type="button" aria-label="Borrar búsqueda">✕</button>
        </div>

        <div id="filters">
          <div class="select-wrap">
            <select id="categoryFilter" aria-label="Filtrar por categoría"></select>
          </div>
          <div class="select-wrap">
            <select id="franchiseFilter" aria-label="Filtrar por franquicia"></select>
          </div>
          <div class="select-wrap">
            <select id="brandFilter" aria-label="Filtrar por marca"></select>
          </div>
          <div class="select-wrap">
            <select id="sortOrder" aria-label="Ordenar por">
              <option value="name-asc">Nombre (A-Z)</option>
              <option value="name-desc">Nombre (Z-A)</option>
              <option value="price-desc">Precio (mayor primero)</option>
              <option value="price-asc">Precio (menor primero)</option>
              <option value="year-desc">Año (más reciente)</option>
              <option value="year-asc">Año (más antiguo)</option>
            </select>
          </div>
        </div>

        <div class="view-toggle" role="group" aria-label="Modo de vista">
          <button type="button" id="viewGrid" aria-pressed="true">▦ Cuadrícula</button>
          <button type="button" id="viewList" aria-pressed="false">☰ Lista</button>
        </div>
      </div>

      <div class="active-filters" id="activeFilters"></div>
    </div>

    <div id="items-counter" class="results-bar" role="status" aria-live="polite"></div>

    <section class="collection-grid" id="collectionGrid"></section>

    <div id="loadMoreSentinel" aria-hidden="true"></div>

    <section class="viewer-3d" id="viewer3d">
      <div class="viewer-3d__head">
        <h3>🧊 Pieza en 3D</h3>
        <span>Arrastra para girar</span>
      </div>
      <div class="viewer-3d__canvas" id="visor-3d-container"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Colección Sweed — catálogo personal</span>
    <span id="footerTotal"></span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
